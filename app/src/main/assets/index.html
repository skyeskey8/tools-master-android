
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TOOLS MASTER</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090909;color:white;font-family:Arial,sans-serif}
header{background:#171717;padding:22px;text-align:center;border-bottom:2px solid #e50914}
header h1{color:#ff2633;margin:0;font-size:28px}
header p{color:#aaa;margin-bottom:0}
.search{padding:18px}
input{width:100%;padding:15px;border-radius:10px;border:1px solid #444;background:#202020;color:white;font-size:16px}
h2{padding:0 18px;color:#ff2633}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:15px}
.tool{background:#1b1b1b;border:1px solid #333;border-radius:12px;padding:18px 10px;text-align:center;cursor:pointer}
.tool span{font-size:27px}
.tool h3{font-size:15px;margin:10px 0 0}
.tool:active{background:#491015}
#panel{margin:15px;padding:18px;background:#1b1b1b;border:1px solid #ff2633;border-radius:12px;display:none}
button{background:#e50914;color:white;border:0;padding:12px;border-radius:8px;margin:8px 3px}
footer{text-align:center;color:#888;padding:25px}
</style>
</head>
<body>

<header>
<h1>TOOLS MASTER</h1>
<p>40 Smart Tools In One Place</p>
</header>

<div class="search">
<input id="search" placeholder="Search your tools..." oninput="filterTools()">
</div>

<h2>🔥 All Tools</h2>
<div class="tools" id="tools"></div>

<div id="panel">
<h2 id="toolTitle">Tool</h2>
<div id="toolContent"></div>
<button onclick="closeTool()">Close</button>
</div>

<footer>TOOLS MASTER © 2026</footer>

<script>
const names=[
["🧮","Calculator"],["📅","Age Calculator"],
["⚖️","BMI Calculator"],["📏","Length Converter"],
["🌡️","Temperature Converter"],["💰","Percentage Calculator"],
["🔢","Number Converter"],["⏱️","Stopwatch"],
["⏰","Timer"],["📆","Date Difference"],
["🔐","Password Generator"],["📝","Word Counter"],
["🔤","Text Case Converter"],["🔠","Character Counter"],
["📋","Text Reverser"],["🎲","Random Number"],
["🎨","Color Picker"],["🔗","URL Encoder"],
["📱","QR Tool"],["💻","Code Viewer"],
["📊","Average Calculator"],["✖️","Multiplication Table"],
["➗","Division Calculator"],["💵","Discount Calculator"],
["🧾","Tax Calculator"],["📐","Area Calculator"],
["🚗","Speed Converter"],["⚖️","Weight Converter"],
["🥤","Volume Converter"],["💾","Data Converter"],
["📖","Daily Notes"],["✅","To Do List"],
["🎯","Goal Tracker"],["🔔","Reminder"],
["🌍","Country Info"],["🗓️","Calendar"],
["🎂","Birthday Counter"],["📚","Study Planner"],
["💡","Idea Notes"],["🛠️","More Tools"]
];

function render(list){
document.getElementById("tools").innerHTML="";
list.forEach(item=>{
let d=document.createElement("div");
d.className="tool";
d.innerHTML="<span>"+item[0]+"</span><h3>"+item[1]+"</h3>";
d.onclick=()=>openTool(item[1]);
document.getElementById("tools").appendChild(d);
});
}

function filterTools(){
let q=document.getElementById("search").value.toLowerCase();
render(names.filter(x=>x[1].toLowerCase().includes(q)));
}

function openTool(name){
document.getElementById("panel").style.display="block";
document.getElementById("toolTitle").innerText=name;
let c=document.getElementById("toolContent");
c.innerHTML='<input id="value1" type="number" placeholder="Enter first number"><input id="value2" type="number" placeholder="Enter second number"><button onclick="calculate()">Calculate</button><p id="result"></p>';
if(name==="Calculator"||name==="Percentage Calculator"||name==="Discount Calculator"){
c.innerHTML='<input id="value1" type="number" placeholder="First number"><input id="value2" type="number" placeholder="Second number"><button onclick="calculate()">Calculate</button><p id="result"></p>';
}
}

function calculate(){
let a=Number(document.getElementById("value1").value);
let b=Number(document.getElementById("value2").value);
let title=document.getElementById("toolTitle").innerText;
let result;
if(title==="Percentage Calculator") result=b===0?"Cannot divide by zero":(a/b*100).toFixed(2)+"%";
else if(title==="Discount Calculator") result=(a-a*b/100).toFixed(2);
else result=a+b;
document.getElementById("result").innerText="Result: "+result;
}

function closeTool(){
document.getElementById("panel").style.display="none";
}
render(names);
</script>
</body>
  </html>
